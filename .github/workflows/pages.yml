# 생성: 2026-09-27 02:30 KST
# web_version 폴더를 GitHub Pages에 배포한다.
# main에 push할 때마다 웹 버전 테스트(node --test)를 먼저 돌리고, 통과하면 web_version만 올린다.
# 저장소 설정 > Pages > Source 를 "GitHub Actions"로 한 번 지정해 두어야 동작한다.
name: 웹 버전 배포 (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 진행 중인 배포는 끝까지 두고 나중 것만 기다린다
concurrency:
  group: pages
  cancel-in-progress: false

# job·step id는 GitHub 문법상 영문·숫자만 쓸 수 있어 영문으로 두고, 이름(name)은 한글로 단다
jobs:
  deploy:
    name: 배포
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 웹 버전 테스트
        working-directory: web_version
        run: node --test

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web_version

      - name: Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v5
