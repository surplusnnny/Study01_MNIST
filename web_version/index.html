<!DOCTYPE html>
<!-- 생성: 2026-09-27 01:30 KST -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>손글씨 숫자 인식기</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="앱">
    <h1>손글씨 숫자 인식기</h1>
    <p class="설명">MNIST로 학습한 CNN이 브라우저 안에서 순수 자바스크립트로 인식합니다. 그린 그림은 기기 밖으로 나가지 않습니다.</p>

    <div class="본문">
      <section class="그림판영역">
        <p class="제목">여기에 숫자 하나를 그려 주세요</p>
        <canvas id="그림판" width="280" height="280" aria-label="숫자를 그리는 그림판"></canvas>
        <div class="버튼줄">
          <button id="지우기버튼" type="button">지우기</button>
          <button id="인식버튼" type="button" disabled>인식하기</button>
        </div>
      </section>

      <section class="결과영역">
        <p class="제목">인식 결과</p>
        <div aria-live="polite" aria-atomic="true">
          <div id="예측숫자" class="예측숫자">?</div>
          <p id="확신도" class="확신도">확신도: -</p>
        </div>
        <ol id="확률막대" class="확률막대"></ol>
        <p class="제목 작게">모델 입력(28x28)</p>
        <canvas id="미리보기" width="28" height="28" aria-label="모델에 들어간 28x28 이미지"></canvas>
      </section>
    </div>

    <p id="상태" class="상태" role="status">모델 불러오는 중…</p>
    <script>
      // type="module"인 js/app.js는 file://에서 CORS로 막혀 아예 실행되지 않는다(Chromium 계열).
      // 그래서 이 안내는 모듈이 아닌 일반 스크립트로, app.js보다 먼저 실행되게 여기 둔다.
      if (location.protocol === 'file:') {
        const 상태 = document.getElementById('상태');
        상태.classList.add('오류');
        상태.textContent = 'index.html 파일을 직접 열면 모델을 불러올 수 없습니다. web_version 폴더에서 python -m http.server 를 실행한 뒤 http://localhost:8000 으로 열어 주세요.';
      }
    </script>
  </main>
</body>
</html>
